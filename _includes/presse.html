<div class="cartes">{% if include.liste.size > 0 %}{% for a in include.liste limit: include.limite %}<a class="carte" href="{{ a.lien | default: '#' }}"{% if include.fond %} style="background:var(--gris-clair)"{% endif %}><small>{{ a.media }}{% if a.date != blank %}, {{ a.date }}{% endif %}</small><strong>{{ a.titre }}</strong></a>{% endfor %}{% else %}<div class="carte a-remplacer">Articles à ajouter</div>{% endif %}</div>
