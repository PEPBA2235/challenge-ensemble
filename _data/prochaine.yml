titre_infos: Infos pratiques
infos:
  adresse: |-
    **Mardi** : complexe sportif Roger-Duchêne à Pordic (accueil dès 10h30), puis stade Jean-François Capitaine à Binic à partir de 17h30.

    **Mercredi** : Binic-Étables-sur-Mer.
  acces: ''
  equipes: |-
    25 équipes de **7 joueurs maximum** (5 joueurs de champ et 2 remplaçants), **nés entre 2011 et 2016**. Mixité possible et encouragée. Chaque structure peut inscrire plusieurs équipes.

    Chaque équipe se voit attribuer un pays lors d’un tirage au sort en avril 2027 : mascotte, drapeaux, maquillage, à votre créativité !
  tarif: '**30 € par personne**, joueur comme accompagnateur. Cela comprend l’inscription au tournoi et aux ateliers, le repas du mardi soir et les animations, le repas du mercredi midi, les goûters des deux jours et les lots.'
  repas: Le repas du mardi midi n’est **pas prévu sur place**. Le repas du mardi soir, celui du mercredi midi et les goûters sont inclus dans la participation.
  hebergement: L’hébergement n’est pas pris en charge. L’organisation reste disponible pour vous orienter vers les logements les plus proches.
  a_prevoir: 'Par joueur : une gourde, une paire de tennis ou de crampons, une tenue adaptée et des **protège-tibias (obligatoires)**. Les chasubles et les ballons sont fournis.'
  sante: Une infirmière coordinatrice est présente les deux jours. Elle peut administrer les médicaments sur présentation d’une ordonnance à jour et du traitement. Un adulte référent est demandé auprès du jeune. Merci de contacter Coralie Rabin dès l’inscription (voir la page Contact).
titre_inscription: Inscription
lien_inscription: https://www.helloasso.com/associations/pep-bretill-armor/evenements/tournoi-football-challenge-ensemble-2027
texte_inscription: |-
  Pour inscrire une équipe :

  1. Envoyer **un bulletin d’inscription par équipe**, complété et signé par chaque équipier et accompagnateur, avec l’autorisation parentale des joueurs, à l.pibouin@pepbretillarmor.org.
  2. Régler la participation en ligne sur HelloAsso (30 € par personne, jeune et adulte).

  L’inscription est validée à réception du dossier complet et du paiement ; l’équipe reçoit alors un mail de confirmation. **Dossier à renvoyer avant le 19 février 2027.**

  Tout désistement doit être signalé au plus tôt : les frais ne sont pas remboursés après le 30 avril 2027.
texte_inscription_fermee: Les inscriptions ne sont pas encore ouvertes. Revenez bientôt ou écrivez-nous pour être prévenu.
