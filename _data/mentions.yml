confidentialite: |-
  Ce site ne dépose pas de cookies de suivi. Les polices de caractères sont chargées depuis le service Google Fonts, et les vidéos depuis YouTube en mode de confidentialité renforcée. Les inscriptions et les paiements se font sur la plateforme HelloAsso, dont la politique de confidentialité s’applique.

  Droit à l’image : les photos et vidéos publiées l’ont été avec l’autorisation des personnes concernées ou de leurs représentants légaux. Pour demander le retrait d’une image, [contactez l’équipe](/contact.html).
