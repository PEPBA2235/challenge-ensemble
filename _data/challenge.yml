chapitres:
- titre: Faire renaître un rendez-vous incontournable
  texte: |-
    À l’origine du Challenge Ensemble, il y a une envie simple : **faire revivre un événement qui a marqué des générations de jeunes et de professionnels des DITEP bretons.**

    Pendant de nombreuses années, le tournoi-kermesse de Combourg (35) était un rendez-vous incontournable du printemps. Une journée attendue avec impatience par les jeunes comme par les salariés, une véritable grande fête des DITEP, placée sous le signe du sport, de la rencontre et de la convivialité.

    Depuis l’arrêt de cet événement, il manquait un temps fort capable de rassembler les établissements autour d’un projet commun.
  photo: /images/illustration-oriflamme.jpg
  photo2: ''
  logos_partenaires: false
- titre: Une idée née au DITEP22
  texte: |-
    C’est au fil des échanges entre collègues du DITEP22 qu’est née l’idée de créer un nouvel événement, en conservant l’esprit festif et fédérateur de Combourg, tout en imaginant une formule différente.

    Très rapidement, nous avons pris contact avec le **Pordic-Binic Football Club**, un club avec lequel plusieurs salariés du DITEP22 entretiennent des liens historiques. L’accueil a été immédiatement enthousiaste : le club a accepté sans hésitation de se lancer dans l’aventure à nos côtés.

    Le Challenge Ensemble pouvait prendre forme !
  photo: /images/illustration-fair-play.jpg
  photo2: ''
  logos_partenaires: false
- titre: Deux jours de sport, de partage et de rencontres
  texte: |-
    Nous avons alors imaginé les contours de cette première édition, avec la volonté de proposer bien plus qu’un simple tournoi de football.

    Le choix s’est porté sur **un événement de deux jours** :

    - une première journée consacrée à des ateliers sportifs, éducatifs et ludiques, favorisant la découverte, la coopération et les échanges ;
    - une grande soirée conviviale autour d’un repas partagé ;
    - une seconde journée dédiée à un tournoi de football, avec le plaisir de jouer, de représenter son équipe et de vivre ensemble un moment fort.

    Autre volonté importante : **ouvrir l’événement au-delà des seuls DITEP**. Nous avons ainsi souhaité inviter les DIME, les structures sociales et médico-sociales partenaires, mais aussi des établissements scolaires et les jeunes du club de football de Pordic-Binic.

    Progressivement, le projet est devenu une grande rencontre autour du football, réunissant des jeunes aux parcours et aux horizons différents, avec une même envie : jouer, partager et vivre une belle expérience collective.
  photo: /images/illustration-action.jpg
  photo2: ''
  logos_partenaires: false
- titre: Une mobilisation exceptionnelle des partenaires
  texte: |-
    Une fois le projet dessiné, il fallait lui donner vie !

    Nous avons mobilisé nos réseaux professionnels, associatifs et sportifs pour trouver des partenaires capables d’animer les ateliers et d’accompagner l’organisation.

    Et les réponses ont dépassé nos espérances : **100 % des structures sollicitées ont répondu favorablement !**

    Le District de Football des Côtes-d’Armor, la Ligue de Bretagne de Football et leurs partenaires, le Comité Départemental du Sport Adapté (CDSA22), ainsi que Stéphane Appriou, éducateur sportif à Lanrodec, ont immédiatement accepté de participer à cette première édition.

    Même enthousiasme du côté des partenaires financiers et institutionnels. La Caisse d’Épargne, le Kiwanis Club de Saint-Brieuc Armor, les PEP Bretill’Armor, le Conseil départemental des Côtes-d’Armor et En Avant Guingamp ont tous répondu présents pour soutenir le projet.

    **Un formidable élan collectif**, qui nous a permis d’aborder sereinement l’organisation de cette première édition.
  photo: ''
  photo2: ''
  logos_partenaires: true
- titre: Une première édition qui concrétise cette belle aventure
  texte: |-
    Les **2 et 3 juin 2026**, au complexe sportif de la Vigie à Binic-Étables-sur-Mer, le Challenge Ensemble est devenu réalité.

    Pendant deux jours, 25 équipes, soit 175 jeunes issus de cinq départements, se sont retrouvées autour du football, des ateliers et de moments de convivialité, accompagnées par de nombreux professionnels, bénévoles et partenaires.

    Au-delà des résultats sportifs, cette première édition a surtout confirmé ce qui nous avait donné envie de créer cet événement : **le sport est un formidable prétexte pour se rencontrer, dépasser les différences, créer des liens et partager des émotions.**

    C’est cet esprit que nous souhaitons faire vivre et grandir au fil des éditions du Challenge Ensemble.
  photo: /images/illustration-esprit-equipe.jpg
  photo2: /images/illustration-celebration.jpg
  logos_partenaires: false
titre_valeurs: Nos valeurs
citation: Ici, l’essentiel n’est pas de gagner, mais de jouer ensemble.
valeurs_cles:
- Inclusion
- Respect
- Solidarité
- Partage
- Dépassement de soi
valeurs: 'Le Challenge Ensemble porte des valeurs fortes : l’inclusion, le respect, la solidarité, le partage et le dépassement de soi. À travers le football, nous souhaitons favoriser les rencontres entre des jeunes aux parcours différents, encourager la coopération et montrer que les différences sont une richesse. Ici, l’essentiel n’est pas de gagner, mais de jouer ensemble, de prendre du plaisir et de faire partie d’une même équipe.'
titre_public: Pour qui ?
public: |-
  Le Challenge Ensemble s’adresse aux **jeunes de 10 à 15 ans**, issus principalement des DITEP, DIME et autres structures sociales et médico-sociales, mais également des établissements scolaires et des clubs de football partenaires.

  L’événement rassemble **25 équipes composées de 7 jeunes**, filles et garçons, accompagnés de leurs encadrants. Lors du tournoi, les rencontres se disputent à **5 contre 5**, avec des remplaçants.

  La volonté est de réunir des jeunes aux profils et aux parcours variés, qu’ils soient sportifs confirmés ou débutants, dans un esprit d’inclusion, de mixité et de convivialité. **Aucun niveau de pratique particulier n’est exigé : l’essentiel est de participer et de partager une belle expérience collective.**
titre_organisateurs: Les organisateurs
organisateurs: |-
  Le Challenge Ensemble est un événement coorganisé par le DITEP22, établissement des PEP Bretill’Armor, et le Pordic-Binic Football Club (PBFC).

  Le projet est porté par une équipe de salariés du DITEP22 et de bénévoles du PBFC, qui mettent en commun leurs compétences, leurs réseaux et leur énergie pour faire vivre cet événement.

  Cette collaboration associe l’expertise éducative et médico-sociale du DITEP22 à l’expérience sportive et associative du PBFC.

  Tout au long de l’année, les organisateurs travaillent ensemble à la préparation de l’événement, avec le soutien de nombreux partenaires sportifs, institutionnels et financiers.

  Une aventure collective, portée avant tout par des personnes engagées et animées par l’envie de rassembler les jeunes autour du sport.
titre_faq: Questions fréquentes
faq:
- question: Qui peut participer au Challenge Ensemble ?
  reponse: 'Le Challenge Ensemble s’adresse aux jeunes de 10 à 15 ans issus des DITEP, DIME, structures sociales et médico-sociales, mais également des établissements scolaires et clubs de football partenaires. L’objectif est de favoriser la rencontre entre des jeunes aux parcours différents, autour d’une passion commune : le sport.'
- question: Faut-il être licencié dans un club de football pour participer ?
  reponse: Non, aucune licence de football n’est nécessaire ! Le Challenge Ensemble est ouvert à tous les niveaux de pratique, des débutants aux joueurs confirmés. Le plaisir de jouer, le respect et l’esprit d’équipe passent avant la performance sportive.
- question: Comment se déroule le Challenge Ensemble ?
  reponse: L’événement se déroule sur deux journées. La première est consacrée à des ateliers sportifs, éducatifs et ludiques, suivis d’un grand repas convivial. La seconde journée laisse place au tournoi de football, avec des rencontres à 5 contre 5 et une remise des récompenses.
- question: Comment inscrire une équipe ?
  reponse: Les inscriptions sont réalisées par les établissements et structures participantes, dans la limite des 25 équipes disponibles. Chaque équipe est composée de 5 à 8 jeunes accompagnés de leurs encadrants. Les modalités et le calendrier d’inscription sont communiqués sur le site internet.
- question: Comment se passe l’hébergement ?
  reponse: L’organisation ne prend pas en charge l’hébergement, mais peut vous orienter vers les logements les plus proches (camping, hébergement en dur…).
