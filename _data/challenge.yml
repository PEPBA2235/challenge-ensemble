titre: Le Challenge Ensemble
sur_titre: Sport · Partage · Inclusion
intro: Un événement coorganisé par le DITEP22 (PEP Bretill’Armor) et le Pordic-Binic Football Club, qui réunit des jeunes aux parcours différents autour du football.
